<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#d97706" stroke-width="3" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.4" />

  <!-- Tree trunk and roots -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roots -->
    <path d="M256 360 C240 395 210 425 160 435" stroke-width="6" />
    <path d="M256 370 C256 405 250 430 240 445" stroke-width="5" />
    <path d="M256 360 C272 395 302 425 352 435" stroke-width="6" />
    <path d="M256 375 C265 410 275 435 290 445" stroke-width="5" />
    <path d="M230 400 C195 415 170 415 140 405" stroke-width="4" />
    <path d="M282 400 C317 415 342 415 372 405" stroke-width="4" />

    <!-- Trunk -->
    <path d="M246 360 C248 300 240 260 210 215" stroke-width="10" />
    <path d="M266 360 C264 300 272 260 302 215" stroke-width="10" />
    <path d="M256 360 L256 220" stroke-width="12" />

    <!-- Main Branches -->
    <path d="M256 250 C210 220 150 200 110 160" stroke-width="7" />
    <path d="M256 250 C302 220 362 200 402 160" stroke-width="7" />
    <path d="M256 220 C235 170 210 135 170 95" stroke-width="6" />
    <path d="M256 220 C277 170 302 135 342 95" stroke-width="6" />
    <path d="M256 200 L256 90" stroke-width="6" />

    <!-- Sub Branches -->
    <path d="M150 185 C125 150 95 140 70 130" stroke-width="4.5" />
    <path d="M185 150 C165 120 145 110 120 100" stroke-width="4.5" />
    <path d="M362 185 C387 150 417 140 442 130" stroke-width="4.5" />
    <path d="M327 150 C347 120 367 110 392 100" stroke-width="4.5" />
  </g>

  <!-- Generation Kinship Nodes / Leaf medallions -->
  <g fill="url(#goldGrad)" stroke="#1c1917" stroke-width="2.5">
    <!-- Top central ancestor -->
    <circle cx="256" cy="85" r="14" />
    <!-- Secondary ancestors -->
    <circle cx="170" cy="95" r="12" />
    <circle cx="342" cy="95" r="12" />
    <!-- Branch nodes -->
    <circle cx="110" cy="155" r="11" />
    <circle cx="402" cy="155" r="11" />
    <circle cx="70" cy="130" r="9" />
    <circle cx="120" cy="100" r="9" />
    <circle cx="442" cy="130" r="9" />
    <circle cx="392" cy="100" r="9" />
    <!-- Center heart node -->
    <circle cx="256" cy="210" r="10" />
    <circle cx="210" cy="215" r="9" />
    <circle cx="302" cy="215" r="9" />
  </g>

  <!-- Crown / Tree Canopy glow particles -->
  <circle cx="256" cy="85" r="4" fill="#ffffff" />
  <circle cx="170" cy="95" r="3.5" fill="#ffffff" />
  <circle cx="342" cy="95" r="3.5" fill="#ffffff" />
</svg>
